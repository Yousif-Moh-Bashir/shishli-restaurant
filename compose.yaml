name: shishli
x-app: &app
  image: shishli-app:local
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: production
  env_file: .env.docker
  restart: unless-stopped
  networks: [private]
  volumes: [storage:/var/www/html/storage]
  depends_on:
    mysql: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  app:
    <<: *app
    healthcheck:
      test: [CMD-SHELL, 'SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  nginx:
    image: shishli-nginx:local
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        VITE_SITE_URL: ${SITE_URL:-https://shishlifresh.com}
    ports: ['127.0.0.1:${SHISHLI_HTTP_PORT:-8088}:80']
    restart: unless-stopped
    networks: [private, ingress]
    volumes: [storage:/var/www/storage:ro]
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/up']
      interval: 15s
      timeout: 5s
      retries: 5
  mysql:
    image: mysql:8.4
    env_file: .env.mysql
    restart: unless-stopped
    networks: [private]
    volumes: [mysql:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec]
    restart: unless-stopped
    networks: [private]
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
  queue:
    <<: *app
    user: www-data
    command: [php, artisan, 'queue:work', redis, '--queue=notifications,default', '--sleep=2', '--tries=3', '--timeout=60', '--max-time=3600', '--no-interaction']
    stop_grace_period: 90s
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'kill -0 1 && php artisan db:monitor --databases=mysql --max=100 --no-interaction >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 3
  scheduler:
    <<: *app
    user: www-data
    command: [php, artisan, 'schedule:work', '--no-interaction']
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'kill -0 1 && php artisan schedule:list --no-interaction >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 3
  tests:
    profiles: [test]
    image: shishli-tests:local
    build: {context: ., dockerfile: docker/php/Dockerfile, target: testing}
    env_file: .env.mysql
    environment:
      APP_ENV: testing
      APP_NAME: Shishli
      BCRYPT_ROUNDS: '4'
      MAIL_MAILER: array
      DB_CONNECTION: mysql
      DB_HOST: mysql-test
      DB_DATABASE: shishli_test
      DB_USERNAME: root
      INVENTORY_MYSQL_CONCURRENCY: '1'
      DRIVER_MYSQL_CONCURRENCY: '1'
      BRANCH_MYSQL_TEST: '1'
      CACHE_STORE: array
      CACHE_LIMITER: array
      CACHE_PREFIX: shishli_testing_
      QUEUE_CONNECTION: sync
      NOTIFICATION_QUEUE_CONNECTION: database
      REDIS_HOST: unused-in-tests
      SESSION_DRIVER: array
    networks: [private]
    depends_on:
      mysql-test: {condition: service_healthy}
    volumes: ['./docs/docker/evidence:/evidence']
    entrypoint: [sh, -c]
    command: ['export DB_PASSWORD="$$MYSQL_ROOT_PASSWORD"; exec php artisan test --compact --log-junit /evidence/laravel-mysql.xml']
  mysql-test:
    profiles: [test]
    image: mysql:8.4
    env_file: .env.mysql
    environment:
      MYSQL_DATABASE: shishli_test
      MYSQL_ROOT_HOST: '%'
    networks: [private]
    volumes: [mysql_test:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h 127.0.0.1 -u root -e "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
  mysql-test-fast:
    profiles: [test]
    image: mysql:8.4
    env_file: .env.mysql
    environment:
      MYSQL_DATABASE: shishli_test
      MYSQL_ROOT_HOST: '%'
    command: [--skip-log-bin, --innodb-flush-log-at-trx-commit=2]
    networks: [private]
    tmpfs: ['/var/lib/mysql:size=536870912']
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h 127.0.0.1 -u root -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s
networks:
  ingress:
    name: shishli_ingress
  private:
    name: shishli_private
    internal: true
volumes:
  mysql: {name: shishli_mysql}
  redis: {name: shishli_redis}
  storage: {name: shishli_storage}
  mysql_test: {name: shishli_mysql_test}
