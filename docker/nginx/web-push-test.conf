server {
    listen 443 ssl;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    ssl_certificate /etc/nginx/mobile-tls/server.crt;
    ssl_certificate_key /etc/nginx/mobile-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/shishli-security.conf;
    client_max_body_size 16k;
    location ~ /\. { deny all; }
    location ~ \.php$ { return 404; }
    location = /api/v1/login { include /etc/nginx/snippets/push-test-fastcgi.conf; }
    location = /api/v1/logout { include /etc/nginx/snippets/push-test-fastcgi.conf; }
    location ^~ /api/v1/admin/push-diagnostics { include /etc/nginx/snippets/push-test-fastcgi.conf; }
    location = /api/v1/finance { return 404; }
    location ^~ /api/v1/finance/ { return 404; }
    # No order/payment/admin mutations can be made through the diagnostic gateway.
    location /api/ {
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
        include /etc/nginx/snippets/push-test-fastcgi.conf;
    }
    location /assets/ { try_files $uri =404; }
    location = /sw.js { try_files $uri =404; add_header Cache-Control "no-cache, no-store" always; }
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location / { try_files $uri $uri/ /index.html; }
}
