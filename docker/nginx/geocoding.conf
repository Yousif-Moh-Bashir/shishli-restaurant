# Fixed upstream/path: never forward client cookies, auth or arbitrary hosts.
# Replace the provider here without changing Vue or exposing a secret key.
location /map-geocoding/ { return 404; }
location = /map-geocoding/autocomplete {
    if ($request_method != GET) { return 405; }
    resolver 127.0.0.11 valid=300s ipv6=off;
    set $autocomplete_host photon.komoot.io;
    limit_req zone=shishli_geocoding burst=5;
    limit_req_status 429;
    proxy_cache shishli_geocoding_cache;
    proxy_cache_key "$autocomplete_host$request_uri";
    proxy_cache_valid 200 1d;
    proxy_cache_lock on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_next_upstream off;
    proxy_pass_request_headers off;
    proxy_set_header Host $autocomplete_host;
    proxy_set_header User-Agent "ShishliDelivery/1.0";
    proxy_set_header Accept "application/json";
    proxy_ssl_server_name on;
    proxy_ssl_name $autocomplete_host;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_pass https://$autocomplete_host/api/$is_args$args;
    add_header X-Geocoding-Cache $upstream_cache_status always;
    include /etc/nginx/snippets/shishli-security.conf;
}
location ~ ^/map-geocoding/(reverse|search)$ {
    if ($request_method != GET) { return 405; }
    resolver 127.0.0.11 valid=300s ipv6=off;
    set $geocoding_host nominatim.openstreetmap.org;
    limit_req zone=shishli_geocoding burst=5;
    limit_req_status 429;
    proxy_cache shishli_geocoding_cache;
    proxy_cache_key "$geocoding_host$request_uri";
    proxy_cache_valid 200 1d;
    proxy_cache_lock on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_next_upstream off;
    proxy_pass_request_headers off;
    proxy_set_header Host $geocoding_host;
    proxy_set_header User-Agent "ShishliDelivery/1.0";
    proxy_set_header Accept "application/json";
    proxy_ssl_server_name on;
    proxy_ssl_name $geocoding_host;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_pass https://$geocoding_host/$1$is_args$args;
    add_header X-Geocoding-Cache $upstream_cache_status always;
    include /etc/nginx/snippets/shishli-security.conf;
}
