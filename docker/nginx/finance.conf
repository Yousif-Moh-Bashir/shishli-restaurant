server {
    listen 8080 default_server;
    server_name _;
    include /etc/nginx/snippets/shishli-security.conf;
    add_header Cache-Control "private, no-store" always;
    return 404;
}
server {
    listen 8080;
    server_name finance.shishlifresh.com;
    root /usr/share/nginx/html;
    index finance.html;
    server_tokens off;
    client_max_body_size 12m;
    include /etc/nginx/snippets/shishli-security.conf;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "private, no-store" always;
    location ~ /\. { deny all; }
    location ~ \.php$ { return 404; }
    location ~ ^/api/v1/finance(?:/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_HOST finance.shishlifresh.com;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 120s;
        add_header Cache-Control "private, no-store" always;
        include /etc/nginx/snippets/shishli-security.conf;
    }
    location /api/ { add_header Cache-Control "private, no-store" always; include /etc/nginx/snippets/shishli-security.conf; return 404; }
    location /storage/ { add_header Cache-Control "private, no-store" always; include /etc/nginx/snippets/shishli-security.conf; return 404; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/shishli-security.conf;
    }
    location / { try_files $uri $uri/ /finance.html; }
    location = /finance.html {
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/shishli-security.conf;
    }
}
