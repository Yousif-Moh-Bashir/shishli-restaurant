server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 24m;
    include /etc/nginx/snippets/shishli-security.conf;
    include /etc/nginx/snippets/shishli-geocoding.conf;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    location ~ /\. { deny all; }
    location ~ \.php$ { return 404; }
    location = /sitemap.xml { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; fastcgi_param SCRIPT_NAME /index.php; fastcgi_param HTTP_PROXY ""; fastcgi_pass app:9000; }
    location = /robots.txt { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; fastcgi_param SCRIPT_NAME /index.php; fastcgi_param HTTP_PROXY ""; fastcgi_pass app:9000; }
    location = /api/v1/finance { add_header Cache-Control "private, no-store" always; include /etc/nginx/snippets/shishli-security.conf; return 404; }
    location ^~ /api/v1/finance/ { add_header Cache-Control "private, no-store" always; include /etc/nginx/snippets/shishli-security.conf; return 404; }
    location /api/ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; fastcgi_param SCRIPT_NAME /index.php; fastcgi_param HTTP_PROXY ""; fastcgi_pass app:9000; }
    location = /up { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; fastcgi_param SCRIPT_NAME /index.php; fastcgi_pass app:9000; }
    location /storage/ { alias /var/www/storage/app/public/; autoindex off; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; include /etc/nginx/snippets/shishli-security.conf; }
    location / { try_files $uri $uri/ /index.html; }
    location = /sw.js { try_files $uri =404; default_type application/javascript; add_header Cache-Control "no-cache, no-store" always; add_header Service-Worker-Allowed "/" always; include /etc/nginx/snippets/shishli-security.conf; }
    location = /manifest.webmanifest { try_files $uri =404; default_type application/manifest+json; add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/shishli-security.conf; }
    location = /index.html { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/shishli-security.conf; }
}
