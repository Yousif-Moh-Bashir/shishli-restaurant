# Opt-in local diagnostics only; never start the ordinary queue/scheduler.
# Use with compose.yaml and --env-file .env.docker. No migrations/entrypoint caches.
services:
  push-test-app:
    profiles: [web-push-diagnostic]
    image: shishli-web-push-diagnostic:local
    build:
      context: .
      dockerfile: docker/php/WebPushDiagnostics.Dockerfile
    env_file: .env.docker
    environment:
      APP_ENV: local
      APP_DEBUG: 'false'
      APP_URL: 'https://${SHISHLI_MOBILE_LAN_IP:?Set the current private LAN IP}:${SHISHLI_WEB_PUSH_TEST_PORT:-8445}'
      LOG_CHANNEL: 'null'
      CACHE_STORE: redis
      STAFF_NOTIFICATIONS_QUEUE_CONNECTION: redis
      STAFF_NOTIFICATIONS_ENABLED: 'false'
      STAFF_NOTIFICATIONS_PUSH_ENABLED: 'false'
      STAFF_NOTIFICATIONS_SOUND_ENABLED: 'false'
      STAFF_WEB_PUSH_DIAGNOSTIC_ENABLED: 'true'
      STAFF_WEB_PUSH_DIAGNOSTIC_ORIGIN: 'https://${SHISHLI_MOBILE_LAN_IP}:${SHISHLI_WEB_PUSH_TEST_PORT:-8445}'
    entrypoint: [php-fpm]
    restart: 'no'
    networks: [private, ingress]

  push-test-web:
    profiles: [web-push-diagnostic]
    image: shishli-web-push-web:local
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: 'no'
    networks: [ingress]
    ports:
      - '${SHISHLI_MOBILE_LAN_IP}:${SHISHLI_WEB_PUSH_TEST_PORT:-8445}:443'
    volumes:
      - type: bind
        source: ./docker/nginx/web-push-test.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docker/nginx/web-push-test-fastcgi.conf
        target: /etc/nginx/snippets/push-test-fastcgi.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./.local-mobile-https/server.crt
        target: /etc/nginx/mobile-tls/server.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./.local-mobile-https/server.key
        target: /etc/nginx/mobile-tls/server.key
        read_only: true
        bind: {create_host_path: false}
