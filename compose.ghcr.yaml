# Standalone future deployment template. Never combine with compose.yaml.
# Runtime environment files live OUTSIDE the repository on the future host.
name: shishli-ghcr
x-app: &app
  image: ghcr.io/yousif-moh-bashir/shishli-app:${GHCR_IMAGE_TAG:?Set GHCR_IMAGE_TAG to sha-FULL_COMMIT_SHA}
  platform: linux/amd64
  env_file: ${SHISHLI_RUNTIME_ENV_FILE:-/etc/shishli/app.env}
  restart: unless-stopped
  networks: [private]
  volumes: [storage:/var/www/html/storage]
  depends_on:
    mysql: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  app:
    <<: *app
    healthcheck:
      test: [CMD-SHELL, 'SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  nginx:
    image: ghcr.io/yousif-moh-bashir/shishli-nginx:${GHCR_IMAGE_TAG:?Set GHCR_IMAGE_TAG to sha-FULL_COMMIT_SHA}
    platform: linux/amd64
    ports: ['127.0.0.1:${SHISHLI_GHCR_HTTP_PORT:-8089}:80']
    restart: unless-stopped
    networks: [private, ingress]
    volumes: [storage:/var/www/storage:ro]
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/up']
      interval: 15s
      timeout: 5s
      retries: 5
  mysql:
    image: mysql:8.4
    env_file: ${SHISHLI_MYSQL_ENV_FILE:-/etc/shishli/mysql.env}
    restart: unless-stopped
    networks: [private]
    volumes: [mysql:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec]
    restart: unless-stopped
    networks: [private]
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
  queue:
    <<: *app
    user: www-data
    command: [php, artisan, 'queue:work', redis, '--queue=notifications,default', '--sleep=2', '--tries=3', '--timeout=60', '--max-time=3600', '--no-interaction']
    stop_grace_period: 90s
    depends_on:
      app: {condition: service_healthy}
  scheduler:
    <<: *app
    user: www-data
    command: [php, artisan, 'schedule:work', '--no-interaction']
    depends_on:
      app: {condition: service_healthy}
networks:
  ingress: {}
  private: {internal: true}
volumes:
  storage: {}
  mysql: {}
  redis: {}
