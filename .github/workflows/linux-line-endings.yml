name: Linux release line endings

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  line-endings:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test docker/tests/linux-line-endings.test.mjs
      - run: node docker/check-linux-line-endings.mjs
