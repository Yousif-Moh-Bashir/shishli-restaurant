name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    name: Laravel / PHP 8.3 / MySQL 8.4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: back-end
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: shishli_ci_test
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
      DB_URL: ''
      CACHE_STORE: array
      CACHE_LIMITER: array
      CACHE_PREFIX: shishli_ci_${{ github.run_id }}_${{ github.run_attempt }}_
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      NOTIFICATION_QUEUE_CONNECTION: database
      MAIL_MAILER: array
      BCRYPT_ROUNDS: '4'
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_PREFIX: shishli_ci_${{ github.run_id }}_${{ github.run_attempt }}_
      REDIS_URL: ''
      REDIS_PASSWORD: ''
      CI_SERVICES_INTEGRATION: '1'
      INVENTORY_MYSQL_CONCURRENCY: '1'
      DRIVER_MYSQL_CONCURRENCY: '1'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: shishli_ci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, mbstring, pdo_mysql, pdo_sqlite, redis, zip, pcntl
          tools: composer:v2
          coverage: none
      - name: Prepare testing environment
        run: |
          test ! -f bootstrap/cache/config.php
          cp .env.example .env
      - name: Validate and install locked Composer dependencies
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
          composer check-platform-reqs
      - name: Check PHP formatting
        run: vendor/bin/pint --test
      - name: Verify isolated MySQL and Redis services
        run: |
          test "$APP_ENV" = testing
          test "$GITHUB_ACTIONS" = true
          test "$DB_CONNECTION" = mysql
          test "$DB_HOST" = 127.0.0.1
          test "$DB_DATABASE" = shishli_ci_test
          php <<'PHP'
          <?php
          $pdo = new PDO('mysql:host=127.0.0.1;port=3306;dbname=shishli_ci_test', 'root', getenv('DB_PASSWORD'), [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
          if ($pdo->query('SELECT DATABASE()')->fetchColumn() !== 'shishli_ci_test') {
              throw new RuntimeException('Refusing a non-CI database.');
          }
          if (!str_starts_with($pdo->query('SELECT VERSION()')->fetchColumn(), '8.4.')) {
              throw new RuntimeException('MySQL 8.4 is required.');
          }
          if ((int) $pdo->query("SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'shishli_ci_test'")->fetchColumn() !== 0) {
              throw new RuntimeException('The runner test database must be empty before migrations.');
          }
          $redis = new Redis();
          $redis->connect('127.0.0.1', 6379);
          if (!$redis->ping()) {
              throw new RuntimeException('Redis is unavailable.');
          }
          if (!str_starts_with($redis->info('server')['redis_version'], '7.4.')) {
              throw new RuntimeException('Redis 7.4 is required.');
          }
          PHP
      - name: Migrate the fresh runner database and verify repeat execution
        run: |
          php artisan migrate --force --no-interaction
          php artisan migrate --force --no-interaction
          php artisan migrate:status --no-ansi > /tmp/migrations-status.txt
      - name: Test MySQL and Redis integration through Laravel
        run: php artisan test --compact --group=ci-services --fail-on-skipped --log-junit=/tmp/services-junit.xml
      - name: Run Laravel unit, feature and MySQL concurrency tests
        run: php artisan test --compact --exclude-group=ci-services --exclude-group=delivery-mysql --fail-on-skipped --log-junit=/tmp/laravel-junit.xml
      - name: Run isolated delivery MySQL concurrency tests
        working-directory: ..
        env:
          DELIVERY_RELEASE_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
          DELIVERY_TEST_ROOT_PASSWORD: ci-only-password
        run: docker compose -f docker/compose.delivery-release-test.yaml -p shishli-delivery-ci up --build --abort-on-container-exit --exit-code-from delivery-tests delivery-tests
      - name: Clean up isolated delivery MySQL services
        if: always()
        working-directory: ..
        env:
          DELIVERY_RELEASE_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
          DELIVERY_TEST_ROOT_PASSWORD: ci-only-password
        run: docker compose -f docker/compose.delivery-release-test.yaml -p shishli-delivery-ci down --volumes --remove-orphans
      - name: Require complete executed business and concurrency coverage
        run: |
          python3 ../.github/scripts/test_check_laravel_results.py
          python3 ../.github/scripts/check-laravel-results.py /tmp/laravel-junit.xml /tmp/services-junit.xml
      - name: Retain migration and JUnit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: laravel-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/migrations-status.txt
            /tmp/services-junit.xml
            /tmp/laravel-junit.xml
          retention-days: 7
          if-no-files-found: warn

  vue:
    name: Vue / Node 22
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front-end
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - name: Install locked npm dependencies
        run: npm ci
      - name: Test delivery location, provider and quote races
        run: npm run test:delivery-location
      - name: Test Saudi phone handling
        run: node --test tests/phone.test.mjs
      - name: Build production frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build

  docker:
    name: Docker Compose / production builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: shishli-ci
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare disposable Compose env files on the runner
        run: |
          cp .env.docker.example .env.docker
          cp .env.mysql.example .env.mysql
      - name: Validate Compose including test profile
        run: docker compose -p shishli-ci --profile test config --quiet
      - name: Build Laravel and Vue Nginx production images without publishing
        run: docker compose -p shishli-ci build app nginx
