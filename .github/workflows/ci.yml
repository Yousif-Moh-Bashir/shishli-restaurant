name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    name: Laravel / PHP 8.3 / MySQL 8.4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: back-end
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: shishli_ci_test
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
      DB_URL: ''
      CACHE_STORE: array
      CACHE_LIMITER: array
      CACHE_PREFIX: shishli_ci_
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      NOTIFICATION_QUEUE_CONNECTION: database
      MAIL_MAILER: array
      BCRYPT_ROUNDS: '4'
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      INVENTORY_MYSQL_CONCURRENCY: '1'
      DRIVER_MYSQL_CONCURRENCY: '1'
      BRANCH_MYSQL_TEST: '1'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: shishli_ci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, mbstring, pdo_mysql, pdo_sqlite, redis, zip, pcntl
          tools: composer:v2
          coverage: none
      - name: Prepare testing environment
        run: |
          test ! -f bootstrap/cache/config.php
          cp .env.example .env
      - name: Validate and install locked Composer dependencies
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
          composer check-platform-reqs
      - name: Check PHP formatting
        run: vendor/bin/pint --test
      - name: Verify isolated MySQL and Redis services
        run: |
          test "$APP_ENV" = testing
          test "$DB_HOST" = 127.0.0.1
          test "$DB_DATABASE" = shishli_ci_test
          php <<'PHP'
          <?php
          $pdo = new PDO('mysql:host=127.0.0.1;port=3306;dbname=shishli_ci_test', 'root', getenv('DB_PASSWORD'), [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
          if ($pdo->query('SELECT DATABASE()')->fetchColumn() !== 'shishli_ci_test') {
              throw new RuntimeException('Refusing a non-CI database.');
          }
          $redis = new Redis();
          $redis->connect('127.0.0.1', 6379);
          if (!$redis->ping()) {
              throw new RuntimeException('Redis is unavailable.');
          }
          PHP
      - name: Run Laravel unit, feature and MySQL concurrency tests
        run: php artisan test --compact

  vue:
    name: Vue / Node 22
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front-end
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - name: Install locked npm dependencies
        run: npm ci
      - name: Test delivery location, provider and quote races
        run: npm run test:delivery-location
      - name: Test Saudi phone handling
        run: node --test tests/phone.test.mjs
      - name: Build production frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build

  docker:
    name: Docker Compose / production builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: shishli-ci
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare disposable Compose env files on the runner
        run: |
          cp .env.docker.example .env.docker
          cp .env.mysql.example .env.mysql
      - name: Validate Compose including test profile
        run: docker compose -p shishli-ci --profile test config --quiet
      - name: Build Laravel and Vue Nginx production images without publishing
        run: docker compose -p shishli-ci build app nginx
